<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagi Kopi Outlet Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: one map card filling the screen; area chips on top, tooltip floats above the hovered pin */
:root {
  --bg: #F3F5F9;
  --card: #FFFFFF;
  --land: #E3E6ED;
  --fg: #23252B;
  --muted: #6F7278;
  --line: #E1E4EB;
  --pin-jabo: #0B6CF0;
  --pin-bdg: #F47B20;
  --pin-sby: #1E9E6A;
  --tip-bg: #23252B;
  --tip-fg: #FFFFFF;
  --font: "Poppins", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161B; --card: #1C1F26; --land: #2B3039; --fg: #ECEEF2; --muted: #9AA0AB; --line: #2E333D;
    --pin-jabo: #4C95FF; --pin-bdg: #FF9447; --pin-sby: #3CC48C; --tip-bg: #ECEEF2; --tip-fg: #14161B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14161B; --card: #1C1F26; --land: #2B3039; --fg: #ECEEF2; --muted: #9AA0AB; --line: #2E333D;
  --pin-jabo: #4C95FF; --pin-bdg: #FF9447; --pin-sby: #3CC48C; --tip-bg: #ECEEF2; --tip-fg: #14161B;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 0.82rem var(--font); color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--card); border-color: var(--fg); }
.chip:focus-visible, .zoom button:focus-visible { outline: 2px solid var(--pin-jabo); outline-offset: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.card {
  position: relative; flex: 1; min-height: 380px; background: var(--card);
  border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
}
svg { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
svg:active { cursor: grabbing; }
.land { fill: var(--land); }
.pin { cursor: pointer; }
.pin .head { stroke: var(--card); }
.pin .hole { fill: var(--card); }
.pin:hover .head, .pin.active .head { filter: brightness(1.12); }
.tip {
  position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 10px));
  background: var(--tip-bg); color: var(--tip-fg); border-radius: 10px; padding: 7px 11px;
  font-size: 0.85rem; line-height: 1.3; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.18);
}
.tip small { display: block; opacity: .7; font-size: 0.72rem; letter-spacing: .02em; }
.tip::after {
  content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px;
  background: var(--tip-bg); transform: translateX(-50%) rotate(45deg);
}
.zoom { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
.zoom button {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--fg); font: 500 1.1rem var(--font); cursor: pointer;
}
.hint { position: absolute; left: 16px; bottom: 14px; color: var(--muted); font-size: 0.78rem; }
@media (max-width: 520px) { .hint { display: none; } }
</style>
</head>

<header>

    <button class="chip" id="chip-bdg" data-area="Bandung Raya" aria-pressed="false"><span class="dot" style="background:var(--pin-bdg)"></span>Bandung Raya · <span data-count="Bandung Raya"></span></button>
    <button class="chip" id="chip-sby" data-area="Surabaya" aria-pressed="false"><span class="dot" style="background:var(--pin-sby)"></span>Surabaya · <span data-count="Surabaya"></span></button>
  </div>
</header>

    <button id="zout" aria-label="Zoom out">−</button>
  </div>
  <div class="hint">Scroll or pinch to zoom · drag to move</div>
</div>

const COLOR = { "Jabodetabek": "var(--pin-jabo)", "Bandung Raya": "var(--pin-bdg)", "Surabaya": "var(--pin-sby)" };

const svg = d3.select("#map");
const card = document.getElementById("card");
const tip = document.getElementById("tip");
const g = svg.append("g");
const landPath = g.append("path").attr("class", "land");
const pinLayer = g.append("g");
let projection, path, k = 1;

// Pin shape in screen pixels, tip at (0,0)
const PIN_D = "M0,0 C-3,-7 -9,-11 -9,-17 A9,9 0 1 1 9,-17 C9,-11 3,-7 0,0 Z";

const pins = pinLayer.selectAll("g.pin")
  .data(OUTLETS.slice().sort((a, b) => b.lat - a.lat))
  .join("g").attr("class", "pin").attr("tabindex", 0)
  .attr("aria-label", d => d.name + ", " + d.area);
pins.append("path").attr("class", "head").attr("d", PIN_D).attr("stroke-width", 1.5)
  .attr("fill", d => COLOR[d.area]);
pins.append("circle").attr("class", "hole").attr("cy", -17).attr("r", 3.4);

function layout() {
  const w = card.clientWidth, h = card.clientHeight;
  svg.attr("viewBox", [0, 0, w, h]);
  projection = d3.geoMercator().fitExtent([[24, 24], [w - 24, h - 24]], JAVA);
  path = d3.geoPath(projection);
  landPath.attr("d", path(JAVA));
  placePins();
}
function placePins() {
  pins.attr("transform", d => {
    const [x, y] = projection([d.lon, d.lat]);
    return `translate(${x},${y}) scale(${1 / k})`;
  });
}
const zoom = d3.zoom().scaleExtent([1, 60]).on("zoom", (e) => {
  k = e.transform.k;
  g.attr("transform", e.transform);
  placePins();
  hideTip();
});
svg.call(zoom).on("dblclick.zoom", null);

function showTip(el, d) {
  const box = el.getBoundingClientRect(), cb = card.getBoundingClientRect();
  tip.innerHTML = `${d.name}<small>${d.area}</small>`;
  tip.style.left = (box.left + box.width / 2 - cb.left) + "px";
  tip.style.top = (box.top - cb.top) + "px";
  tip.hidden = false;
  pins.classed("active", p => p === d);
  d3.select(el).raise();
}
function hideTip() { tip.hidden = true; pins.classed("active", false); }
pins.on("mouseenter focus", function (e, d) { showTip(this, d); })
    .on("mouseleave blur", hideTip)
    .on("click", function (e, d) { e.stopPropagation(); showTip(this, d); });
svg.on("click", hideTip);

function zoomToArea(area) {
  const w = card.clientWidth, h = card.clientHeight;
  if (area === "all") { svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity); return; }
  const pts = OUTLETS.filter(o => o.area === area).map(o => projection([o.lon, o.lat]));
  const [x0, x1] = d3.extent(pts, p => p[0]), [y0, y1] = d3.extent(pts, p => p[1]);
  const pad = 70;
  const scale = Math.min(40, (w - pad * 2) / Math.max(x1 - x0, 1), (h - pad * 2) / Math.max(y1 - y0, 1));
  const t = d3.zoomIdentity.translate(w / 2, h / 2 + 10).scale(scale).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  svg.transition().duration(800).call(zoom.transform, t);
}
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
  hideTip();
  zoomToArea(b.dataset.area);
}));
document.getElementById("zin").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.8);
document.getElementById("zout").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.8);

document.getElementById("total").textContent = OUTLETS.length;
document.querySelectorAll("[data-count]").forEach(s => s.textContent = OUTLETS.filter(o => o.area === s.dataset.count).length);
layout();
window.addEventListener("resize", () => { layout(); svg.call(zoom.transform, d3.zoomIdentity); });
</script>
